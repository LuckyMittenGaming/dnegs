<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Poker chip hamburger menu</title>
  <desc id="desc">Gold poker chip with three black menu bars.</desc>
  <defs>
    <radialGradient id="chipGold" cx="35%" cy="25%" r="75%">
      <stop offset="0" stop-color="#fff4c5"/>
      <stop offset="0.32" stop-color="#f4c76b"/>
      <stop offset="0.62" stop-color="#b97824"/>
      <stop offset="1" stop-color="#3d2308"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff1b2"/>
      <stop offset="0.48" stop-color="#d19835"/>
      <stop offset="1" stop-color="#5a350d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <circle cx="256" cy="256" r="224" fill="url(#rim)" filter="url(#shadow)"/>
  <circle cx="256" cy="256" r="188" fill="#070707" opacity="0.25"/>
  <circle cx="256" cy="256" r="174" fill="url(#chipGold)"/>
  <circle cx="256" cy="256" r="132" fill="#120b04" opacity="0.28"/>
  <circle cx="256" cy="256" r="120" fill="url(#chipGold)"/>
  <g fill="#1b1106" opacity="0.95">
    <rect x="156" y="188" width="200" height="28" rx="14"/>
    <rect x="156" y="242" width="200" height="28" rx="14"/>
    <rect x="156" y="296" width="200" height="28" rx="14"/>
  </g>
  <g fill="#fff2bc" opacity="0.55">
    <rect x="73" y="235" width="54" height="42" rx="12" transform="rotate(-90 100 256)"/>
    <rect x="385" y="235" width="54" height="42" rx="12" transform="rotate(90 412 256)"/>
    <rect x="229" y="79" width="54" height="42" rx="12"/>
    <rect x="229" y="391" width="54" height="42" rx="12"/>
  </g>
</svg>
